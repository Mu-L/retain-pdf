name: Tests

# 全量测试门禁：rust workspace + 前端（含棘轮/边界门禁）+ ai_service（含契约锁）。
# 此前这三套只在本地跑，CI 无人站岗——门禁存在但拦不住绕过（先例：v4.1.9
# home-ask 带着 4 类门禁违规发布）。python pipeline 聚合 suite 依赖重
#（PyMuPDF/pikepdf 等），暂由 translation-replay 覆盖其子集，未纳入本 workflow。

"on":
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  rust-workspace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/api

      # 必须 --workspace：裸 cargo test 只跑主 crate，会漏掉
      # retain-core/retain-data/retain-jobs 三个子 crate 的测试
      - name: Cargo Workspace Tests
        run: cargo test --workspace --manifest-path services/api/Cargo.toml

  packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (root workspaces)
        run: npm ci

      - name: Test and build @retainpdf/contracts
        run: |
          npm --prefix packages/schemas test
          npm --prefix packages/schemas run typecheck
          npm --prefix packages/schemas run build

      - name: Typecheck and build @retainpdf/domain
        run: |
          npm --prefix packages/domain run typecheck
          npm --prefix packages/domain run build

      - name: Build @retainpdf/ui
        run: npm --prefix packages/ui run build

      - name: Build @retainpdf/api
        run: npm --prefix packages/api run build

      - name: Typecheck @retainpdf/reader
        run: npm --prefix packages/reader run typecheck

      - name: Build @retainpdf/reader
        run: npm --prefix packages/reader run build

  frontend:
    runs-on: ubuntu-latest
    needs: packages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (root workspaces)
        run: npm ci

      - name: Build frontend package dependencies
        run: |
          npm --prefix packages/schemas run build
          npm --prefix packages/domain run build
          npm --prefix packages/ui run build
          npm --prefix packages/api run build
          npm --prefix packages/reader run build

      - name: Frontend Tests
        working-directory: apps/web
        run: npm test

      - name: React Frontend Tests
        working-directory: apps/web-react
        run: npm test

  ai-service:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop/requirements-ai-service.txt pytest

      - name: AI Service Tests
        working-directory: services/ai
        run: python -m pytest tests -q
