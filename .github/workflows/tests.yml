name: Tests

# 全量测试门禁：rust workspace + 前端（含棘轮/边界门禁）+ ai_service（含契约锁）。
# 此前这三套只在本地跑，CI 无人站岗——门禁存在但拦不住绕过（先例：v4.1.9
# home-ask 带着 4 类门禁违规发布）。python pipeline 聚合 suite 依赖重
#（PyMuPDF/pikepdf 等），暂由 translation-replay 覆盖其子集；本 workflow
# 只验证其可安装性、命令契约和包边界。

"on":
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  rust-workspace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare embedded backend package
        id: backend
        uses: ./.github/actions/prepare-backend-source

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.19"
          python-version: "3.11"

      - name: Install locked Python workspace for executor tests
        run: uv sync --project "$RETAIN_PDF_SERVICES_ROOT" --locked --all-extras

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ steps.backend.outputs.path }}/api

      # 必须 --workspace：裸 cargo test 只跑主 crate，会漏掉
      # retain-core/retain-data/retain-jobs 三个子 crate 的测试
      - name: Cargo Workspace Tests
        run: cargo test --locked --workspace --manifest-path "$RETAIN_PDF_SERVICES_ROOT/api/Cargo.toml"

  packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (root workspaces)
        run: npm ci

      - name: Test and build @retainpdf/contracts
        run: |
          npm --prefix packages/schemas test
          npm --prefix packages/schemas run typecheck
          npm --prefix packages/schemas run build

      - name: Typecheck and build @retainpdf/domain
        run: |
          npm --prefix packages/domain run typecheck
          npm --prefix packages/domain run build

      - name: Build @retainpdf/ui
        run: npm --prefix packages/ui run build

      - name: Build @retainpdf/api
        run: npm --prefix packages/api run build

      - name: Typecheck @retainpdf/reader
        run: npm --prefix packages/reader run typecheck

      - name: Build @retainpdf/reader
        run: npm --prefix packages/reader run build

  frontend:
    runs-on: ubuntu-latest
    needs: packages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (root workspaces)
        run: npm ci

      - name: Build frontend package dependencies
        run: |
          npm --prefix packages/schemas run build
          npm --prefix packages/domain run build
          npm --prefix packages/ui run build
          npm --prefix packages/api run build
          npm --prefix packages/reader run build

      - name: Frontend Tests
        working-directory: apps/web
        run: npm test

      - name: React Frontend Tests
        working-directory: apps/web-react
        run: npm test

  python-services:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare embedded backend package
        id: backend
        uses: ./.github/actions/prepare-backend-source

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Install
        run: uv sync --project "$RETAIN_PDF_SERVICES_ROOT" --locked --all-extras

      - name: Check generated dependency manifests
        run: uv run --project "$RETAIN_PDF_SERVICES_ROOT" python .github/scripts/sync_backend_python_requirements.py --repo-root . --services-root "$RETAIN_PDF_SERVICES_ROOT" --check

      - name: Check installed command contracts
        run: |
          uv run --project "$RETAIN_PDF_SERVICES_ROOT" retainpdf-pipeline --help
          uv run --project "$RETAIN_PDF_SERVICES_ROOT" python -c "import retainpdf_ai, retainpdf_pipeline"

      - name: AI Service Tests
        run: uv run --project "$RETAIN_PDF_SERVICES_ROOT" python -m pytest "$RETAIN_PDF_SERVICES_ROOT/ai/tests" -q

      - name: Pipeline package entrypoint tests
        run: uv run --project "$RETAIN_PDF_SERVICES_ROOT" python -m pytest "$RETAIN_PDF_SERVICES_ROOT/pipeline/devtools/tests/entrypoints/test_console.py" -q

  backend-standalone:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare embedded backend package
        id: backend
        uses: ./.github/actions/prepare-backend-source

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install locked backend test environment
        run: uv sync --project "$RETAIN_PDF_SERVICES_ROOT" --locked --all-extras

      - name: Test backend source resolver
        run: uv run --project "$RETAIN_PDF_SERVICES_ROOT" python -m pytest .github/scripts/tests/test_resolve_backend_source.py -q

      - name: Check backend contract mirror parity
        run: |
          python3 "$RETAIN_PDF_SERVICES_ROOT/contracts/check_parity.py"
          for backend_schema in "$RETAIN_PDF_SERVICES_ROOT"/contracts/*.schema.json; do
            product_schema="$GITHUB_WORKSPACE/packages/schemas/$(basename "$backend_schema")"
            diff -- "$backend_schema" "$product_schema"
          done

      - name: Verify isolated backend workspace
        run: python3 "$RETAIN_PDF_SERVICES_ROOT/scripts/check_standalone.py" --compile-rust

      - name: Build backend source archive
        run: python3 "$RETAIN_PDF_SERVICES_ROOT/scripts/build_source_archive.py"

      - name: Upload backend source archive
        uses: actions/upload-artifact@v4
        with:
          name: retainpdf-backend-source-${{ steps.backend.outputs.tree }}
          path: |
            ${{ steps.backend.outputs.path }}/dist/*.tar.gz
            ${{ steps.backend.outputs.path }}/dist/*.sha256
          if-no-files-found: error
