name: Tests

# 全量测试门禁：rust workspace + 前端（含棘轮/边界门禁）+ ai_service（含契约锁）。
# 此前这三套只在本地跑，CI 无人站岗——门禁存在但拦不住绕过（先例：v4.1.9
# home-ask 带着 4 类门禁违规发布）。python pipeline 聚合 suite 依赖重
#（PyMuPDF/pikepdf 等），暂由 translation-replay 覆盖其子集；本 workflow
# 只验证其可安装性、命令契约和包边界。

"on":
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  rust-workspace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/api

      # 必须 --workspace：裸 cargo test 只跑主 crate，会漏掉
      # retain-core/retain-data/retain-jobs 三个子 crate 的测试
      - name: Cargo Workspace Tests
        run: cargo test --workspace --manifest-path services/api/Cargo.toml

  packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (root workspaces)
        run: npm ci

      - name: Test and build @retainpdf/contracts
        run: |
          npm --prefix packages/schemas test
          npm --prefix packages/schemas run typecheck
          npm --prefix packages/schemas run build

      - name: Typecheck and build @retainpdf/domain
        run: |
          npm --prefix packages/domain run typecheck
          npm --prefix packages/domain run build

      - name: Build @retainpdf/ui
        run: npm --prefix packages/ui run build

      - name: Build @retainpdf/api
        run: npm --prefix packages/api run build

      - name: Typecheck @retainpdf/reader
        run: npm --prefix packages/reader run typecheck

      - name: Build @retainpdf/reader
        run: npm --prefix packages/reader run build

  frontend:
    runs-on: ubuntu-latest
    needs: packages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install (root workspaces)
        run: npm ci

      - name: Build frontend package dependencies
        run: |
          npm --prefix packages/schemas run build
          npm --prefix packages/domain run build
          npm --prefix packages/ui run build
          npm --prefix packages/api run build
          npm --prefix packages/reader run build

      - name: Frontend Tests
        working-directory: apps/web
        run: npm test

      - name: React Frontend Tests
        working-directory: apps/web-react
        run: npm test

  python-services:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Install
        run: uv sync --project services --locked --all-extras

      - name: Check generated dependency manifests
        run: uv run --project services python services/pipeline/devtools/sync_python_requirements.py --repo-root . --check

      - name: Check installed command contracts
        run: |
          uv run --project services retainpdf-pipeline --help
          uv run --project services python -c "import retainpdf_ai, retainpdf_pipeline"

      - name: AI Service Tests
        run: uv run --project services python -m pytest services/ai/tests -q

      - name: Pipeline package entrypoint tests
        run: uv run --project services python -m pytest services/pipeline/devtools/tests/entrypoints/test_console.py -q

  backend-standalone:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check backend contract mirror parity
        run: python3 services/contracts/check_parity.py --require-upstream

      - name: Verify isolated backend workspace
        run: python3 services/scripts/check_standalone.py --compile-rust
