name: Desktop Frontend Sync

"on":
  pull_request:
    paths:
      - ".github/workflows/desktop-frontend-sync.yml"
      - ".githooks/pre-commit"
      - "apps/desktop/package.json"
      - "apps/desktop/package-lock.json"
      - "apps/desktop/scripts/prepare-app.mjs"
      - "apps/desktop/scripts/check-frontend-bundle.mjs"
      - "apps/web/**"
      - "packages/api/**"
      - "packages/domain/**"
      - "packages/reader/**"
      - "packages/schemas/**"
      - "packages/ui/**"
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/desktop-frontend-sync.yml"
      - ".githooks/pre-commit"
      - "apps/desktop/package.json"
      - "apps/desktop/package-lock.json"
      - "apps/desktop/scripts/prepare-app.mjs"
      - "apps/desktop/scripts/check-frontend-bundle.mjs"
      - "apps/web/**"
      - "packages/api/**"
      - "packages/domain/**"
      - "packages/reader/**"
      - "packages/schemas/**"
      - "packages/ui/**"
  workflow_dispatch: {}

jobs:
  desktop-frontend-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/web/package-lock.json

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Install frontend dependencies
        working-directory: apps/web
        run: |
          npm ci
          # @tailwindcss/oxide 需本机原生绑定；npm optionalDeps 偶发漏装时补齐
          node -e "require('@tailwindcss/oxide')" \
            || npm install --no-save --no-package-lock "@tailwindcss/oxide@$(node -p "require('./node_modules/@tailwindcss/oxide/package.json').version")"

      - name: Verify desktop frontend generation
        env:
          RETAIN_PDF_DESKTOP_PLATFORM: linux
          RETAIN_PDF_SKIP_BUNDLED_RUNTIME_VERIFICATION: "1"
        run: npm --prefix apps/desktop run verify-frontend-sync

      - name: Check tracked generated files are up to date
        run: |
          git diff --exit-code -- \
            apps/web/styles.css \
            apps/desktop/build/icons \
            apps/desktop/package.json
