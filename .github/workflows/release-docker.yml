name: Release Docker Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: '镜像版本号，例如 v4.2.0'
        required: true
        default: 'dev'
      push:
        description: '是否推送到 Docker Hub？选 false 则只构建不推送'
        type: boolean
        required: false
        default: false
      platforms:
        description: '目标平台（逗号分隔）'
        required: false
        default: 'linux/amd64,linux/arm64'
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: app
            repo: retainpdf-app
          - name: web
            repo: retainpdf-web

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 .github/scripts/resolve_release_version.py \
              --tag "${{ inputs.version }}" \
              --allow-label \
              --github-output "$GITHUB_OUTPUT"
          else
            python3 .github/scripts/resolve_release_version.py \
              --tag "$GITHUB_REF_NAME" \
              --github-output "$GITHUB_OUTPUT"
          fi

      - name: Prepare embedded backend package
        if: matrix.target.name == 'app'
        id: backend
        uses: ./.github/actions/prepare-backend-source

      - name: Resolve image build source
        id: build-source
        shell: bash
        run: |
          if [ "${{ matrix.target.name }}" = "app" ]; then
            echo "context=${{ steps.backend.outputs.path }}" >> "$GITHUB_OUTPUT"
            echo "file=${{ steps.backend.outputs.path }}/docker/Dockerfile.app" >> "$GITHUB_OUTPUT"
          else
            echo "context=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
            echo "file=$GITHUB_WORKSPACE/infra/docker/Dockerfile.web" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve Docker Hub namespace
        id: hub
        run: |
          user="${{ secrets.DOCKERHUB_USERNAME }}"
          if [ -z "$user" ]; then
            user="${GITHUB_REPOSITORY_OWNER}"
          fi
          echo "user=${user}" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.hub.outputs.user }}/${{ matrix.target.repo }}
          tags: |
            type=raw,value=${{ steps.release.outputs.tag }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && steps.release.outputs.stable == 'true' }}

      - name: Login to Docker Hub
        if: inputs.push || github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate build args
        id: build-args
        run: |
          {
            for var in http_proxy https_proxy HTTP_PROXY HTTPS_PROXY ALL_PROXY TYPST_VERSION; do
              val="$(printenv "$var" || true)"
              if [ -n "$val" ]; then
                echo "${var}=${val}"
              fi
            done
            echo "RETAIN_PDF_VERSION=${{ steps.release.outputs.version }}"
          } > /tmp/build-args.txt
          {
            echo 'args<<EOF'
            cat /tmp/build-args.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.build-source.outputs.context }}
          file: ${{ steps.build-source.outputs.file }}
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: ${{ inputs.push || github.event_name == 'push' }}
          build-args: ${{ steps.build-args.outputs.args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
